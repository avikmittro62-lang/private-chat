<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F5D62">
<title>আমরা দুজন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #E9EEEA;
  --ink: #1E2B2F;
  --muted: #5D6F71;
  --mine: #2F5D62;
  --mine-ink: #F4FAF8;
  --theirs: #FFFFFF;
  --line: #C5D1CD;
  --live: #D9A441;
  --danger: #A93B32;
  --font: "Hind Siliguri", "Noto Sans Bengali", "Nirmala UI", "Kalpurush", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111B1C;
    --ink: #E4EDEA;
    --muted: #8FA3A3;
    --mine: #3B7379;
    --theirs: #1D2B2C;
    --line: #2A3C3D;
    --live: #E3B04F;
    --danger: #E0776D;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
button, input, textarea { font: inherit; color: inherit; }

/* ---------- Login ---------- */
.login {
  min-height: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(32px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.login h1 { font-size: 36px; line-height: 1.2; font-weight: 600; margin: 0 0 8px; }
.login .hint { color: var(--muted); margin: 0 0 28px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 4px; }
.field input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--theirs);
  font-size: 17px;
}
.err { color: var(--danger); margin: 0 0 12px; font-weight: 500; }
.primary {
  width: 100%;
  padding: 13px 16px;
  border: 0;
  border-radius: 12px;
  background: var(--mine);
  color: var(--mine-ink);
  font-weight: 600;
  cursor: pointer;
}
.primary:disabled { opacity: .6; cursor: default; }

/* ---------- Chat ---------- */
.chat {
  height: 100%;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
}
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
}
.who { display: flex; align-items: center; gap: 10px; font-weight: 500; min-width: 0; }
.who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); }
.dot.on { background: var(--live); border-color: var(--live); }
.btns { display: flex; gap: 8px; flex: none; }
.ghost {
  flex: none;
  background: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 4px 12px;
  color: var(--muted);
  cursor: pointer;
}
.net {
  background: var(--danger);
  color: #fff;
  text-align: center;
  font-size: 14px;
  padding: 4px 12px;
}
.list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overscroll-behavior: contain;
}
.empty { margin: auto; color: var(--muted); text-align: center; padding: 0 24px; }
.row { display: flex; }
.row.mine { justify-content: flex-end; }
.bubble {
  max-width: 80%;
  padding: 8px 12px 6px;
  border-radius: 16px;
  background: var(--theirs);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
  overflow-wrap: anywhere;
}
.row.mine .bubble {
  background: var(--mine);
  color: var(--mine-ink);
  border-color: var(--mine);
  border-bottom-left-radius: 16px;
  border-bottom-right-radius: 4px;
}
.bubble .t { white-space: pre-wrap; }
.bubble time { display: block; text-align: right; font-size: 12px; opacity: .65; margin-top: 2px; }
.typing { padding: 0 16px 4px; font-size: 14px; color: var(--muted); }
.composer {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
}
.composer textarea {
  flex: 1;
  resize: none;
  max-height: 140px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--theirs);
  font-size: 17px;
  line-height: 1.4;
}
.composer .primary { width: auto; padding: 10px 18px; border-radius: 20px; }
</style>
</head>
<body>

<main id="login" class="login">
  <h1>শুধু তুমি আর আমি</h1>
  <p class="hint">এই ঘরে তুমি আর আমি ছাড়া আর কারও জায়গা নেই। সারাদিনের হাজার কথার ভিড়ে সবচেয়ে ভালো লাগার কথাগুলো শুধু তোমার জন্য তুলে রাখি। তুমি এলেই আমার সব কথা শুরু হয়। ভালোবাসি তোমাকে।</p>
  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="name">তোমার নাম (দুজন আলাদা নাম দিও)</label>
      <input id="name" name="username" autocomplete="username" maxlength="24" autocapitalize="words">
    </div>
    <div class="field">
      <label for="pw">আমাদের পাসওয়ার্ড</label>
      <input id="pw" name="password" type="password" autocomplete="current-password">
    </div>
    <p id="err" class="err" role="alert" hidden></p>
    <button id="enter" type="submit" class="primary">ভেতরে এসো</button>
  </form>
</main>

<div id="chat" class="chat" hidden>
  <div class="bar">
    <div class="who"><span id="dot" class="dot"></span><span id="status">অপেক্ষায় আছি…</span></div>
    <div class="btns">
      <button id="wipe" type="button" class="ghost">মুছো</button>
      <button id="leave" type="button" class="ghost">বের হন</button>
    </div>
  </div>
  <div id="net" class="net" hidden>সংযোগ নেই, আবার চেষ্টা করছি…</div>
  <div id="list" class="list" role="log" aria-live="polite"></div>
  <div id="typing" class="typing" hidden></div>
  <form id="composer" class="composer">
    <textarea id="text" rows="1" maxlength="2000" placeholder="মনের কথা লেখো…" aria-label="মেসেজ"></textarea>
    <button type="submit" class="primary">পাঠাও</button>
  </form>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var loginEl = $('login'), chatEl = $('chat'), errEl = $('err'), nameEl = $('name'), pwEl = $('pw');
  var enterBtn = $('enter'), listEl = $('list'), textEl = $('text'), statusEl = $('status');
  var dotEl = $('dot'), netEl = $('net'), typingEl = $('typing');

  var ws = null, me = '', pw = '', joined = false, keepAlive = false, handledClose = false;
  var retryTimer = null, typingHide = null, lastTypingSent = 0;
  var baseTitle = document.title;
  var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;

  var SS = {
    get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  };

  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var KEY = 'chat_msgs_v1', MAXLOCAL = 2000;
  var msgs = [];

  function norm(m) {
    if (!m || !m.id || typeof m.text !== 'string') return null;
    return { id: String(m.id), from: String(m.from || ''), text: m.text, ts: Number(m.ts) || 0 };
  }
  function loadLocal() {
    try {
      var a = JSON.parse(LS.get(KEY) || '[]');
      return Array.isArray(a) ? a.map(norm).filter(Boolean) : [];
    } catch (e) { return []; }
  }
  function saveLocal() { LS.set(KEY, JSON.stringify(msgs.slice(-MAXLOCAL))); }
  function merge(list) {
    var have = {}, added = [];
    msgs.forEach(function (m) { have[m.id] = 1; });
    list.forEach(function (raw) {
      var m = norm(raw);
      if (m && !have[m.id]) { have[m.id] = 1; msgs.push(m); added.push(m); }
    });
    msgs.sort(function (a, b) { return a.ts - b.ts; });
    return added;
  }

  var ERR = {
    wrong_password: 'পাসওয়ার্ড ভুল হয়েছে।',
    room_full: 'ঘর ভরা। এখনই দুজন ঢুকে আছে।',
    too_many_attempts: 'অনেকবার ভুল হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।',
    bad_name: 'একটা নাম লিখুন (সর্বোচ্চ ২৪ অক্ষর)।',
    replaced: 'একই নামে অন্য ডিভাইসে ঢোকা হয়েছে।'
  };

  function fmt(ts) {
    try { return new Date(ts).toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return new Date(ts).toLocaleTimeString(); }
  }

  function showLogin(msg) {
    chatEl.hidden = true;
    loginEl.hidden = false;
    enterBtn.disabled = false;
    enterBtn.textContent = 'ভেতরে এসো';
    errEl.hidden = !msg;
    errEl.textContent = msg || '';
  }
  function showChat() {
    loginEl.hidden = true;
    chatEl.hidden = false;
  }

  function scrollDown() { listEl.scrollTop = listEl.scrollHeight; }

  function setPeers(peers) {
    var others = peers.filter(function (n) { return n !== me; });
    statusEl.textContent = others.length ? others.join(', ') + ' অনলাইনে আছে' : 'অপেক্ষায় আছি…';
    dotEl.classList.toggle('on', others.length > 0);
    if (!others.length) typingEl.hidden = true;
  }

  function addMsg(m, quiet) {
    var empty = listEl.querySelector('.empty');
    if (empty) empty.remove();
    var nearBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 120;
    var mine = m.from === me;
    var row = document.createElement('div');
    row.className = 'row ' + (mine ? 'mine' : 'theirs');
    var b = document.createElement('div');
    b.className = 'bubble';
    var t = document.createElement('span');
    t.className = 't';
    t.textContent = m.text;
    var tm = document.createElement('time');
    tm.textContent = fmt(m.ts);
    b.appendChild(t);
    b.appendChild(tm);
    row.appendChild(b);
    listEl.appendChild(row);
    if (mine || nearBottom) scrollDown();
    if (!quiet && !mine && document.hidden) document.title = '● ' + baseTitle;
  }

  function showEmpty() {
    var d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'এখনো কোনো কথা হয়নি। প্রথম কথাটা তুমিই বলো।';
    listEl.appendChild(d);
  }

  function handleError(reason) {
    keepAlive = false;
    handledClose = true;
    SS.del('n'); SS.del('p');
    showLogin(ERR[reason] || 'কিছু একটা ভুল হয়েছে। আবার চেষ্টা করুন।');
  }

  function handle(m) {
    switch (m.type) {
      case 'joined':
        joined = true; keepAlive = true;
        me = m.you || me;
        netEl.hidden = true;
        SS.set('n', me); SS.set('p', pw);
        showChat();
        listEl.textContent = '';
        msgs = loadLocal();
        merge(m.history || []);
        saveLocal();
        msgs.forEach(function (x) { addMsg(x, true); });
        if (!msgs.length) showEmpty();
        setPeers(m.peers || []);
        scrollDown();
        break;
      case 'msg':
        if (merge([m]).length) { saveLocal(); addMsg(m); }
        if (m.from !== me) typingEl.hidden = true;
        break;
      case 'presence':
        setPeers(m.peers || []);
        break;
      case 'typing':
        typingEl.textContent = m.from + ' লিখছে…';
        typingEl.hidden = false;
        clearTimeout(typingHide);
        typingHide = setTimeout(function () { typingEl.hidden = true; }, 3500);
        break;
      case 'error':
        handleError(m.reason);
        break;
    }
  }

  function connect() {
    clearTimeout(retryTimer);
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var sock = new WebSocket(proto + '//' + location.host);
    ws = sock;
    sock.onopen = function () {
      sock.send(JSON.stringify({ type: 'join', name: me, password: pw }));
    };
    sock.onmessage = function (e) {
      if (sock !== ws) return;
      var m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      handle(m);
    };
    sock.onclose = function () {
      if (sock !== ws) return;
      joined = false;
      if (keepAlive) {
        netEl.hidden = false;
        retryTimer = setTimeout(connect, 2000);
      } else if (!handledClose) {
        showLogin('সংযোগ করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।');
      }
    };
  }

  function attempt() {
    errEl.hidden = true;
    enterBtn.disabled = true;
    enterBtn.textContent = 'আসছি…';
    handledClose = false;
    connect();
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    me = nameEl.value.trim();
    pw = pwEl.value;
    if (!me || !pw) {
      showLogin('নাম আর পাসওয়ার্ড দুটোই লিখুন।');
      return;
    }
    attempt();
  });

  $('leave').addEventListener('click', function () {
    keepAlive = false;
    SS.del('n'); SS.del('p');
    var s = ws; ws = null;
    if (s) s.close();
    pwEl.value = '';
    showLogin('');
  });

  $('wipe').addEventListener('click', function () {
    if (!confirm('এই ফোনে সেভ করা সব মেসেজ মুছে যাবে। মুছবে?')) return;
    msgs = [];
    LS.del(KEY);
    listEl.textContent = '';
    showEmpty();
  });

  function send() {
    var text = textEl.value.trim();
    if (!text || !ws || ws.readyState !== 1 || !joined) return;
    ws.send(JSON.stringify({ type: 'msg', text: text }));
    textEl.value = '';
    grow();
    textEl.focus();
  }
  function grow() {
    textEl.style.height = 'auto';
    textEl.style.height = Math.min(textEl.scrollHeight, 140) + 'px';
  }

  $('composer').addEventListener('submit', function (e) { e.preventDefault(); send(); });
  textEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  textEl.addEventListener('input', function () {
    grow();
    var now = Date.now();
    if (ws && ws.readyState === 1 && joined && now - lastTypingSent > 2500) {
      lastTypingSent = now;
      ws.send(JSON.stringify({ type: 'typing' }));
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      document.title = baseTitle;
      if (keepAlive && (!ws || ws.readyState > 1)) connect();
    }
  });

  // ট্যাব রিলোড করলে আবার নিজে থেকে ঢুকে যাওয়া (ট্যাব বন্ধ করলে মুছে যায়)
  var sn = SS.get('n'), sp = SS.get('p');
  if (sn && sp) {
    me = sn; pw = sp;
    nameEl.value = sn;
    attempt();
  }
})();
</script>
</body>
</html>
